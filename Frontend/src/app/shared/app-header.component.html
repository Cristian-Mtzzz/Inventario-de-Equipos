<header class="app-header">
  <div class="brand">
    <!-- Espacio del logo institucional; se configura con LOGO_SRC en app-header.component.ts. -->
    <div class="brand-logo" [class.brand-logo-placeholder]="!logoSrc">
      @if (logoSrc) {
      <img [src]="logoSrc" alt="Logo de la institución" />
      } @else {
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="4" width="18" height="12" rx="2" />
        <path d="M8 20h8M12 16v4" />
      </svg>
      }
    </div>
    <div class="brand-text">
      <span class="brand-name">Gestión de Equipos</span>
      <span class="brand-module">{{ moduleName() }}</span>
    </div>
  </div>

  <div class="header-end">
    @if (userName()) {
    <div class="header-user" [attr.title]="userName()">
      <span class="user-avatar" aria-hidden="true">{{ initials() }}</span>
      <span class="user-text">
        <strong>{{ userName() }}</strong>
        <small>{{ roleLabel() }}</small>
      </span>
    </div>
    }
    <div class="header-actions">
      <button type="button" class="refresh-button" (click)="refresh.emit()">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 11a8 8 0 0 0-14.9-3.9M4 4v4h4M4 13a8 8 0 0 0 14.9 3.9M20 20v-4h-4" />
        </svg>
        <span>Refrescar</span>
      </button>
      <button type="button" class="logout-button" (click)="logout.emit()">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H4" />
        </svg>
        <span>Cerrar sesión</span>
      </button>
    </div>
  </div>
</header>
